[workspace]
resolver = "3"
members = [
  "pkgs/examples/hello-rust",
  "pkgs/support/nats-http-bridge",
  "pkgs/tools/abird-host-agent",
  "pkgs/tools/abird-host-manager",
  "pkgs/tools/nats-wrecking-ball",
]

[workspace.dependencies]
anyhow = "1"
async-nats = "0.47"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
humantime = "2"
libc = "0.2"
rand = "0.10.1"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"
