[package]
name = "abird-host-manager"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Operator-side control plane for Abird host and service migrations"

[dependencies]
abird-host-agent = { path = "../abird-host-agent" }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
humantime = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
